function normalize(str) {
    return str.toLowerCase().replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(s) {
        return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
    }).replace(/\s+/g, '');
}

function searchGames() {
    var inputElem = document.getElementById('searchInput');
    var query = normalize(inputElem.value);
    var grid = document.getElementById('resultGrid');
    var countDiv = document.getElementById('resultCount');
    
    grid.innerHTML = '';
    if (!query) {
        countDiv.innerHTML = 'キーワードを入力してください';
        return;
    }
    
    var matched = [];
    for (var i = 0; i < allGames.length; i++) {
        if (normalize(allGames[i].title).indexOf(query) !== -1) {
            matched.push(allGames[i]);
        }
    }
    
    countDiv.innerHTML = matched.length + '件ヒットしました';
    var maxShow = 50;
    if (matched.length > maxShow) countDiv.innerHTML += ' (※最初の50件を表示中)';
    
    var html = '';
    var limit = Math.min(matched.length, maxShow);
    for (var j = 0; j < limit; j++) {
        var game = matched[j];
        html += '<div class="card">';
        html += '<img src="' + game.img + '" alt="image">';
        html += '<p>[' + game.platform + ']<br>' + game.title + '</p>';
        html += '<a href="psns:browse?product=' + game.id + '" class="btn">ストアを開く</a>';
        
        if (game.has_dlc) {
            html += '<a href="dlc_' + game.title_id + '.html" class="btn-dlc">DLCを見る (' + game.dlc_count + '件)</a>';
        }
        html += '</div>';
    }
    grid.innerHTML = html;
}

window.onload = function() {
    var inputElem = document.getElementById('searchInput');
    if (inputElem && inputElem.value !== '') {
        searchGames();
    }
};
